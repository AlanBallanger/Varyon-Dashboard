name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level high --prod
        continue-on-error: false

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Create deployment package
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          HYTALE_MODS_PATH: ${{ secrets.HYTALE_MODS_PATH }}
          LOKI_LOG_SELECTOR: ${{ secrets.LOKI_LOG_SELECTOR }}
          API_PORT: ${{ secrets.API_PORT }}
          PLAYERS_PROMQL: ${{ secrets.PLAYERS_PROMQL }}
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r server deploy/
          cp package.json deploy/
          cp pnpm-lock.yaml deploy/
          python3 - <<'PY'
          import os
          keys = [
            "LOKI_URL",
            "PROMETHEUS_URL",
            "HYTALE_MODS_PATH",
            "LOKI_LOG_SELECTOR",
            "API_PORT",
            "PLAYERS_PROMQL",
          ]
          with open("deploy/.env", "w", encoding="utf-8") as f:
              for key in keys:
                  value = os.environ.get(key, "")
                  f.write(f"{key}={value}\n")
          PY
          cd deploy
          tar -czf ../deploy.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: deploy.tar.gz
          retention-days: 1

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Extract and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}

            rm -rf dist server

            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz

            corepack enable
            corepack prepare pnpm@10.8.1 --activate
            pnpm install --frozen-lockfile --prod

            pm2 delete varyon-dashboard || true
            NODE_ENV=production pm2 start pnpm --name "varyon-dashboard" -- start

            pm2 save
